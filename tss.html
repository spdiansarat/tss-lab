    const templateEl = document.querySelector('script[type="__bundler/template"]');

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than

    // DOMParser/replaceWith are inert per spec — re-create each with

cyan-tint-2: #C4E5F5;\n\n  --coral: #FF6B4A;\n  --coral-tint: #FFE6E0;\n  --amber: #FFD23F;\n  --amber-deep: #8A5A00;\n  --amber-tint: #FFF6E0;\n  --amber-tint-2: #FFE7B3;\n  --plum: #5B2A86;\n  --teal: #0d9488;\n\n  --ink: #0E1116;\n  --ink-2: #1A1D23;\n  --ink-3: #2A2F37;\n  --ink-4: #5A6068;\n  --ink-5: #9AA0A8;\n  --line: #E5E7EB;\n  --line-2: #D0D4D9;\n  --paper: #FAFAF7;\n  --paper-2: #F4F4F1;\n  --paper-3: #ECECE7;\n  --white: #FFFFFF;\n\n  --sb-bg: #1E2433;\n  --sb-bg-2: #171c28;\n  --sb-text: #cbd5e1;\n  --sb-label: #64748b;\n  --sb-hover: rgba(255,255,255,0.06);\n\n  --font-display: 'Quicksand', system-ui, sans-serif;\n  --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;\n  --font-mono: 'JetBrains Mono', ui-monospace, monospace;\n\n  --radius: 8px;\n  --radius-lg: 12px;\n  --radius-xl: 16px;\n  --shadow: 0 1px 2px rgba(14,17,22,0.06);\n  --shadow-md: 0 4px 14px rgba(14,17,22,0.08);\n  --shadow-lg: 0 18px 48px rgba(14,17,22,0.16);\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml, body { height: 100%; }\nbody {\n  font-family: var(--font-body);\n  background: var(--paper);\n  color: var(--ink);\n  font-size: 14px;\n  line-height: 1.5;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  overflow: hidden;\n}\n\n::-webkit-scrollbar { width: 9px; height: 9px; }\n::-webkit-scrollbar-thumb { background: rgba(14,17,22,0.16); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }\n::-webkit-scrollbar-thumb:hover { background: rgba(14,17,22,0.28); background-clip: padding-box; }\n.sidebar ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); background-clip: padding-box; }\n\nh1, h2, h3, h4, h5 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.015em; }\n.mono { font-family: var(--font-mono); }\nbutton { font-family: inherit; cursor: pointer; }\ninput, select, textarea { font-family: inherit; }\n\n/* ---------------- Layout ---------------- */\n.app { display: flex; height: 100vh; overflow: hidden; }\n.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }\n.content { flex: 1; overflow-y: auto; padding: 26px 32px 40px; }\n.content.flush { padding: 0; display: flex; flex-direction: column; }\n\n/* ---------------- Sidebar ---------------- */\n.sidebar {\n  width: 248px; min-width: 248px;\n  background: linear-gradient(180deg, #242d45 0%, #1a2133 52%, #131826 100%);\n  display: flex; flex-direction: column;\n  overflow: visible; position: relative;\n}\n.sb-toggle {\n  position: absolute; top: 60px; right: -13px; z-index: 30;\n  width: 26px; height: 26px; border-radius: 50%;\n  background: var(--cyan); color: #fff; border: 2px solid #131826;\n  display: grid; place-items: center; cursor: pointer;\n  box-shadow: 0 4px 12px -2px rgba(0,0,0,0.45);\n  transition: background .15s, transform .15s;\n}\n.sb-toggle:hover { background: var(--cyan-dark); }\n.sb-toggle svg { width: 14px; height: 14px; transition: transform .24s ease; }\n.sidebar.collapsed .sb-toggle svg { transform: rotate(180deg); }\n.sb-brand {\n  display: flex; align-items: center; gap: 12px;\n  padding: 20px 18px 16px;\n  border-bottom: 1px solid rgba(255,255,255,0.07);\n}\n.sb-mark { width: 32px; height: 32px; flex: none; color: #f1f5f9; }\n.sb-brand .nm { line-height: 1.05; }\n.sb-brand .nm b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 15px; color: #f1f5f9; letter-spacing: -0.01em; }\n.sb-brand .nm span { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.18em; color: var(--sb-label); text-transform: uppercase; }\n\n.sb-search {\n  margin: 12px 14px 6px;\n  display: flex; align-items: center; gap: 8px;\n  padding: 8px 11px;\n  background: rgba(255,255,255,0.05);\n  border: 1px solid rgba(255,255,255,0.07);\n  border-radius: var(--radius);\n  color: #94a3b8; font-size: 12px;\n}\n.sb-search svg { width: 13px; height: 13px; flex: none; opacity: 0.7; }\n.sb-search kbd { margin-left: auto; font-family: var(--font-mono); font-size: 9px; padding: 2px 5px; background: rgba(255,255,255,0.08); border-radius: 4px; color: #cbd5e1; }\n\n.sb-nav { flex: 1; overflow-y: auto; padding: 8px 10px 12px; }\n.sb-group { margin-top: 12px; }\n.sb-group:first-child { margin-top: 4px; }\n.sb-label { font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; color: var(--sb-label); text-transform: uppercase; letter-spacing: 0.12em; padding: 4px 10px 6px; }\n.sb-item {\n  display: flex; align-items: center; gap: 10px;\n  padding: 8px 10px; border-radius: var(--radius);\n  font-size: 13px; color: var(--sb-text);\n  cursor: pointer; transition: background .12s, color .12s;\n  border: 1px solid transparent; margin-bottom: 1px;\n  user-select: none;\n}\n.sb-item svg { width: 16px; height: 16px; flex: none; opacity: 0.62; }\n.sb-item:hover { background: var(--sb-hover); color: #e7edf5; }\n.sb-item:hover svg { opacity: 0.9; }\n.sb-item.active { background: linear-gradient(135deg, var(--cyan), var(--cyan-dark)); color: #fff; border-color: transparent; box-shadow: 0 8px 18px -8px rgba(40,160,220,0.7); }\n.sb-item.active svg { opacity: 1; color: #fff; }\n.sb-badge {\n  margin-left: auto; background: rgba(255,255,255,0.09); color: #cbd5e1;\n  font-family: var(--font-mono); font-size: 10px; font-weight: 600;\n  padding: 1px 6px; border-radius: 8px; line-height: 1.4;\n}\n.sb-badge.alert { background: rgba(255,107,74,0.24); color: #fda08a; }\n.sb-item.active .sb-badge { background: rgba(255,255,255,0.28); color: #fff; }\n\n/* ---------------- Collapsed rail ---------------- */\n.sidebar.collapsed { width: 76px; min-width: 76px; }\n.sidebar.collapsed .nm,\n.sidebar.collapsed .sb-label,\n.sidebar.collapsed .sb-item > span,\n.sidebar.collapsed .sb-search span,\n.sidebar.collapsed .sb-search kbd,\n.sidebar.collapsed .who,\n.sidebar.collapsed .gear { display: none; }\n.sidebar.collapsed .sb-brand { justify-content: center; padding: 20px 0 16px; gap: 0; }\n.sidebar.collap
